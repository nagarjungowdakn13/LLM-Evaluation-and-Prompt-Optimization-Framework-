[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallueval"
version = "0.1.0"
description = "A framework and study instrument for evaluating and benchmarking hallucination reduction techniques in LLMs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
hallueval = "hallueval.cli:main"
